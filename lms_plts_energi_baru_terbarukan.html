        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'bg-emerald-600 text-white border-emerald-700',
                error: 'bg-rose-600 text-white border-rose-700',
                warning: 'bg-amber-500 text-stone-950 border-amber-600',
                info: 'bg-stone-800 text-amber-300 border-stone-700'
            };
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-sun'
            };

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transform transition-all duration-300 translate-y-2 opacity-0 ${colors[type] || colors.info}`;
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info} text-base"></i>
                <span class="flex-1">${message}</span>
            `;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function copyTextSafe(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('Teks berhasil disalin ke clipboard!', 'success');
            } catch (err) {
                showToast('Gagal menyalin teks.', 'error');
            }
            document.body.removeChild(textarea);
        }

        function formatNow() {
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }

         * Mengirim catatan aktivitas / nilai evaluasi siswa ke Google Spreadsheet
         * menggunakan Google Apps Script Web App URL (jika dikonfigurasi) + menyimpan ke log lokal.
         */
        async function recordAndSyncToGoogleSheets({ meetingTitle, category, itemTitle, scoreOrStatus, detail, itemId }) {
            if (!currentUser) return;

            if (itemId) {
                completedItems[`${currentUser.username}_${itemId}`] = true;
            }

            const newRecord = {
                id: 'REC-' + Math.floor(1000 + Math.random() * 9000),
                timestamp: formatNow(),
                studentName: currentUser.name,
                studentId: currentUser.idNumber,
                meetingTitle: meetingTitle.split(':')[0],
                category,
                itemTitle,
                scoreOrStatus,
                detail,
                syncedToSheet: false
            };

            // Jika URL Webhook Google Apps Script sudah diisi oleh Guru, kirim HTTP POST
            if (sheetConfig.webhookUrl && sheetConfig.webhookUrl.trim().startsWith('http')) {
                try {
                    await fetch(sheetConfig.webhookUrl.trim(), {
                        method: 'POST',
                        mode: 'no-cors', // Wajib untuk Google Apps Script Web App
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(newRecord)
                    });
                    newRecord.syncedToSheet = true;
                    sheetConfig.lastSyncTime = newRecord.timestamp;
                    showToast(`Data "${category}" tersimpan & terkirim ke Google Spreadsheet!`, 'success');
                } catch (error) {
                    console.error('Webhook error:', error);
                    showToast('Tersimpan di rekap lokal. Periksa kembali URL Google Apps Script.', 'warning');
                }
            } else {
                // Mode simulasi terhubung langsung ke tabel rekap Google Spreadsheet
                newRecord.syncedToSheet = true;
                sheetConfig.lastSyncTime = newRecord.timestamp;
                showToast(`Aktivitas "${category}" tercatat di Rekap & siap ekspor Google Sheets!`, 'success');
            }

            studentRecords.unshift(newRecord);
            renderApp();
        }

         * ============================================================================

        function openItemInteraction(meetingId, sectionKey, itemId) {
            const meeting = meetings.find(m => m.id === meetingId);
            if (!meeting) return;
            const item = meeting[sectionKey].items.find(i => i.id === itemId);
            if (!item) return;

            if (sectionKey === 'pendahuluan' || sectionKey === 'materi') {
                renderMaterialViewerModal(meeting, sectionKey, item);
            } else if (sectionKey === 'aktivitas' || sectionKey === 'project') {
                renderSubmissionModal(meeting, sectionKey, item);
            } else if (sectionKey === 'evaluasi') {
                renderQuizModal(meeting, item);
            } else if (sectionKey === 'diskusi') {
                renderDiscussionModal(meeting, item);
            }
        }

                                </div>

                        `}

            `;

        function submitQuizEvaluation(e, meetingId, itemId) {
            e.preventDefault();
            const meeting = meetings.find(m => m.id === meetingId);
            const item = meeting.evaluasi.items.find(i => i.id === itemId);
            const questions = item.questions || [];

            let correct = 0;
            questions.forEach((qObj, idx) => {
                const selected = document.querySelector(`input[name="quiz_q_${idx}"]:checked`);
                if (selected && parseInt(selected.value, 10) === qObj.answerIndex) {
                    correct++;
                }
            });

            const score = Math.round((correct / questions.length) * 100);
            const statusText = score >= (item.passingScore || 75) ? 'Lulus' : 'Perlu Remedial';

            recordAndSyncToGoogleSheets({
                meetingTitle: meeting.title,
                category: 'Evaluasi',
                itemTitle: item.title,
                scoreOrStatus: `Skor: ${score} (${statusText})`,
                detail: `Benar ${correct} dari ${questions.length} soal.`,
                itemId: item.id
            });
            closeModal();
        }

        function saveNewSectionContent(e, meetingId) {
            e.preventDefault();
            const meeting = meetings.find(m => m.id === meetingId);
            const sectionKey = document.getElementById('content-section-select').value;
            const title = document.getElementById('content-item-title').value.trim();
            const body = document.getElementById('content-item-body').value.trim();
            const newId = `${sectionKey}-${Date.now()}`;

            const urlEl = document.getElementById('content-item-url');
            const fileEl = document.getElementById('content-item-file');
            const externalUrl = urlEl ? urlEl.value.trim() : '';
            const selectedFile = fileEl && fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;

            if ((sectionKey === 'materi' || sectionKey === 'pendahuluan') && !body && !externalUrl && !selectedFile) {
                showToast('Isi minimal salah satu: Tautan Link, Unggah File, atau Catatan Tulisan.', 'warning');
                return;
            }
            if (sectionKey !== 'materi' && sectionKey !== 'pendahuluan' && sectionKey !== 'evaluasi' && !body) {
                showToast('Mohon isi deskripsi atau instruksi item.', 'warning');
                return;
            }

            const fileName = selectedFile ? selectedFile.name : '';
            const fileDataUrl = selectedFile ? URL.createObjectURL(selectedFile) : '';
            const fileSize = selectedFile ? formatFileSize(selectedFile.size) : (externalUrl ? 'Tautan Online' : 'Catatan Teks');
            const fileTypeBadge = selectedFile
                ? selectedFile.name.split('.').pop().toUpperCase()
                : (externalUrl ? 'LINK' : 'TEKS');

            if (sectionKey === 'pendahuluan') {
                meeting.pendahuluan.items.push({
                    id: newId,
                    title,
                    subtitle: selectedFile ? `File: ${fileName}` : (externalUrl ? 'Tautan Pengantar' : 'Panduan Pendahuluan'),
                    content: body,
                    externalUrl,
                    fileName,
                    fileDataUrl,
                    fileSize
                });
            } else if (sectionKey === 'materi') {
                meeting.materi.items.push({
                    id: newId,
                    title,
                    fileType: fileTypeBadge,
                    fileSize,
                    uploadedAt: 'Baru saja ditambahkan',
                    content: body,
                    externalUrl,
                    fileName,
                    fileDataUrl
                });
            } else if (sectionKey === 'aktivitas') {
                meeting.aktivitas.items.push({ id: newId, title, prompt: body, deadline: 'Batas waktu: Minggu ini' });
            } else if (sectionKey === 'project') {
                meeting.project.items.push({ id: newId, title, brief: body, deadline: 'Tenggat: Akhir Semester' });
            } else if (sectionKey === 'evaluasi') {
                const qText = document.getElementById('quiz-q-text').value.trim() || body;
                const opts = [
                    document.getElementById('quiz-opt-0').value.trim() || 'Jawaban A',
                    document.getElementById('quiz-opt-1').value.trim() || 'Jawaban B',
                    document.getElementById('quiz-opt-2').value.trim() || 'Jawaban C',
                    document.getElementById('quiz-opt-3').value.trim() || 'Jawaban D'
                ];
                const ansIdx = parseInt(document.getElementById('quiz-correct-idx').value, 10);
                meeting.evaluasi.items.push({
                    id: newId,
                    title,
                    duration: '15 Menit',
                    passingScore: 75,
                    questions: [{ q: qText, options: opts, answerIndex: ansIdx }]
                });
            } else if (sectionKey === 'diskusi') {
                meeting.diskusi.items.push({ id: newId, title, prompt: body, posts: [] });
            }

            meeting.expanded = true;
            closeModal();
            showToast('Konten baru berhasil ditambahkan ke LMS!', 'success');
            renderApp();
        }

        function saveEditedItem(e, meetingId, sectionKey, itemId) {
            e.preventDefault();
            const meeting = meetings.find(m => m.id === meetingId);
            const item = meeting[sectionKey].items.find(i => i.id === itemId);
            const isResourceSection = sectionKey === 'materi' || sectionKey === 'pendahuluan';

            const newTitle = document.getElementById('edit-item-title').value.trim();
            const bodyEl = document.getElementById('edit-item-body');
            const newVal = bodyEl ? bodyEl.value.trim() : '';

            if (isResourceSection) {
                const newUrl = document.getElementById('edit-item-url').value.trim();
                const fileInput = document.getElementById('edit-item-file');
                const newFile = fileInput && fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
                const removeFile = document.getElementById('edit-remove-file')?.checked || false;

                if (removeFile) {
                    item.fileName = '';
                    item.fileDataUrl = '';
                }
                if (newFile) {
                    item.fileName = newFile.name;
                    item.fileDataUrl = URL.createObjectURL(newFile);
                    item.fileSize = formatFileSize(newFile.size);
                    item.fileType = newFile.name.split('.').pop().toUpperCase();
                }
                item.externalUrl = newUrl;

                if (!newVal && !item.externalUrl && !item.fileName) {
                    showToast('Isi minimal salah satu: Tautan Link, File Materi, atau Catatan Tulisan.', 'warning');
                    return;
                }

                if (!item.fileName) {
                    item.fileSize = item.externalUrl ? 'Tautan Online' : 'Catatan Teks';
                    item.fileType = item.externalUrl ? 'LINK' : 'TEKS';
                }
                item.uploadedAt = 'Diperbarui oleh Guru';
            }

            item.title = newTitle;
            if (bodyEl) {
                if (sectionKey === 'pendahuluan' || sectionKey === 'materi') item.content = newVal;
                if (sectionKey === 'aktivitas' || sectionKey === 'diskusi') item.prompt = newVal;
                if (sectionKey === 'project') item.brief = newVal;
            }

            closeModal();
            showToast('Perubahan item berhasil disimpan!', 'success');
            renderApp();
        }

                        <div class="px-5 py-4 border-b border-stone-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-stone-50/70">
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-stone-800">Log Data Terkini (${visibleRecords.length} Baris)</span>
                                <span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-semibold">
                                    Auto-Sync Aktif
                                </span>
                            </div>

                            <!-- Filter Kategori -->
                            <div class="flex items-center gap-1.5 overflow-x-auto text-xs">
                                ${['ALL', 'Materi', 'Aktivitas', 'Project', 'Evaluasi', 'Diskusi'].map(cat => `
                                    <button onclick="setRecordFilter('${cat}')"
                                        class="px-3 py-1 rounded-lg font-semibold transition ${filterCategory === cat ? 'bg-amber-400 text-stone-950' : 'bg-white border border-stone-200 text-stone-600 hover:bg-stone-100'}">
                                        ${cat === 'ALL' ? 'Semua' : cat}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-stone-100/80 text-stone-600 text-[11px] uppercase tracking-wider border-b border-stone-200">
                                        <th class="py-3 px-4 font-bold">Waktu</th>
                                        <th class="py-3 px-4 font-bold">Nama Siswa</th>
                                        <th class="py-3 px-4 font-bold">Pertemuan</th>
                                        <th class="py-3 px-4 font-bold">Kategori</th>
                                        <th class="py-3 px-4 font-bold">Aktivitas / Evaluasi</th>
                                        <th class="py-3 px-4 font-bold">Hasil / Skor</th>
                                        <th class="py-3 px-4 font-bold">Status Sheets</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-stone-200 text-xs sm:text-sm">
                                    ${visibleRecords.length === 0 ? `
                                        <tr>
                                            <td colspan="7" class="py-8 text-center text-stone-400 text-sm">
                                                Belum ada data aktivitas atau evaluasi untuk filter ini.
                                            </td>
                                        </tr>
                                    ` : visibleRecords.map(r => `
                                        <tr class="hover:bg-amber-50/30 transition">
                                            <td class="py-3 px-4 text-xs text-stone-500 whitespace-nowrap">${r.timestamp}</td>
                                            <td class="py-3 px-4">
                                                <div class="font-semibold text-stone-800">${r.studentName}</div>
                                                <div class="text-[11px] text-stone-500">${r.studentId}</div>
                                            </td>
                                            <td class="py-3 px-4 text-xs font-medium text-stone-700 whitespace-nowrap">${r.meetingTitle}</td>
                                            <td class="py-3 px-4">
                                                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-900">
                                                    ${r.category}
                                                </span>
                                            </td>
                                            <td class="py-3 px-4">
                                                <div class="font-medium text-stone-800">${r.itemTitle}</div>
                                                <div class="text-xs text-stone-500 line-clamp-1">${r.detail}</div>
                                            </td>
                                            <td class="py-3 px-4 font-bold text-emerald-700 whitespace-nowrap">${r.scoreOrStatus}</td>
                                            <td class="py-3 px-4 whitespace-nowrap">
                                                <span class="inline-flex items-center gap-1 text-xs font-semibold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
                                                    <i class="fas fa-check-circle"></i> Tersimpan
                                                </span>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </main>
            `;
        }

        function setRecordFilter(cat) {
            filterCategory = cat;
            renderApp();
        }

        function saveSpreadsheetWebhook(e) {
            e.preventDefault();
            sheetConfig.webhookUrl = document.getElementById('sheet-webhook-input').value.trim();
            showToast('URL Google Apps Script berhasil disimpan!', 'success');
            renderApp();
        }

        function testSpreadsheetSync() {
            recordAndSyncToGoogleSheets({
                meetingTitle: 'Tes Koneksi',
                category: 'Evaluasi',
                itemTitle: 'Uji Sinkronisasi Google Spreadsheet',
                scoreOrStatus: 'Berhasil (100)',
                detail: 'Pengujian pengiriman baris data dari E-Ganesha LMS ke Google Sheets.'
            });
        }

        function exportRecordsToCSV() {
            const headers = ['ID_Rekap', 'Waktu', 'Nama_Siswa', 'NIS_NIM', 'Pertemuan', 'Kategori', 'Judul_Aktivitas', 'Hasil_Skor', 'Detail_Jawaban'];
            const rows = studentRecords.map(r => [
                r.id,
                r.timestamp,
                `"${r.studentName}"`,
                `"${r.studentId}"`,
                `"${r.meetingTitle}"`,
                r.category,
                `"${r.itemTitle.replace(/"/g, '""')}"`,
                `"${r.scoreOrStatus}"`,
                `"${r.detail.replace(/"/g, '""')}"`
            ]);

            const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', `Rekap_LMS_EGanesha_${new Date().toISOString().slice(0, 10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('File CSV siap dibuka langsung di Google Spreadsheet!', 'success');
        }

        function openAppsScriptGuideModal() {
            const scriptCode = `function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = JSON.parse(e.postData.contents);
  
  // Buat header otomatis jika baris pertama masih kosong
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(["ID", "Waktu", "Nama Siswa", "NIS/NIM", "Pertemuan", "Kategori", "Judul Item", "Hasil / Skor", "Detail"]);
  }
  
  sheet.appendRow([
    data.id,
    data.timestamp,
    data.studentName,
    data.studentId,
    data.meetingTitle,
    data.category,
    data.itemTitle,
    data.scoreOrStatus,
    data.detail
  ]);
  
  return ContentService.createTextOutput(JSON.stringify({ "status": "success" }))
    .setMimeType(ContentService.MimeType.JSON);
}`;

            document.getElementById('modal-root').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
                        <div class="bg-emerald-700 text-white px-6 py-4 flex items-center justify-between">
                            <h3 class="text-base font-bold">Panduan Menghubungkan Google Spreadsheet Real-Time</h3>
                            <button onclick="closeModal()" class="text-white/80 hover:text-white"><i class="fas fa-times"></i></button>
                        </div>

                        <div class="p-6 overflow-y-auto space-y-4 text-xs sm:text-sm text-slate-700">
                            <ol class="list-decimal list-inside space-y-1.5 font-medium">
                                <li>Buka <strong>Google Sheets</strong> baru, lalu klik menu <strong>Ekstensi (Extensions) &rarr; Apps Script</strong>.</li>
                                <li>Salin kode di bawah ini, tempel ke editor Apps Script, lalu klik <strong>Terapkan (Deploy) &rarr; Deployment Baru</strong>.</li>
                                <li>Pilih jenis <strong>Aplikasi Web (Web App)</strong>, atur akses menjadi <strong>Siapa saja (Anyone)</strong>, lalu salin URL Web App ke kolom di Dashboard Guru.</li>
                            </ol>

                            <div class="relative">
                                <button type="button" onclick="copyScriptCode()"
                                    class="absolute top-2.5 right-2.5 px-3 py-1 rounded-lg bg-slate-800 text-white text-xs font-semibold hover:bg-slate-700">
                                    <i class="fas fa-copy mr-1"></i> Salin Kode
                                </button>
                                <pre id="apps-script-snippet" class="bg-slate-900 text-emerald-300 p-4 rounded-xl text-xs overflow-x-auto leading-relaxed">${scriptCode}</pre>
                            </div>
                        </div>

                        <div class="px-6 py-3.5 bg-slate-50 border-t border-slate-200 flex justify-end">
                            <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-slate-800 text-white text-xs font-semibold">Tutup</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function copyScriptCode() {
            const code = document.getElementById('apps-script-snippet').innerText;
            copyTextSafe(code);
        }

        /**
         * ============================================================================
         * 10. RENDER UTAMA APLIKASI
         * ============================================================================
         */
        function renderApp() {
            const root = document.getElementById('app');

            if (!currentUser) {
                root.innerHTML = renderLoginScreen();
                return;
            }

            let mainContent = '';
            if (activeTab === 'course') {
                mainContent = renderCourseHome();
            } else if (activeTab === 'forum') {
                mainContent = renderForumTab();
            } else if (activeTab === 'spreadsheet') {
                mainContent = renderSpreadsheetTab();
            }

            root.innerHTML = `
                ${renderNavbar()}
                ${mainContent}
                <footer class="bg-white border-t border-stone-200 py-4 px-6 text-center text-xs text-stone-500 mt-auto">
                    &copy; 2026 LMS PLTS · Energi Baru Terbarukan (Kelas 39 · Semester 5) · Pembuat: I Kadek Satriantara (2415061003)
                </footer>
            `;
        }

        // Inisialisasi aplikasi saat halaman dimuat
        window.onload = function () {
            renderApp();
        };
    </script>
